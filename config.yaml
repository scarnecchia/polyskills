# Example Polytoken user config shipped with the polyskills template.
#
# Copy to ~/.config/polytoken/config.yaml and adapt:
#   - The model groups below (workhorse / arch / review) are referenced by the
#     vendored skills and facets via @mg:workhorse, @mg:arch, and @mg:review.
#     Fill in model references your providers authorize; the commented lines
#     show the illustrative format.
#   - The playwright server entry is an example; adjust the chromium
#     executable path for your machine or remove the server entirely.
version: 4
modelgroups:
  # Implementors, correctness/test-quality/coverage review seats.
  # Entry format: <provider>/<model>(<effort>) — e.g. provider-a/model-x(high)
  workhorse:
    - <workhorse-model-1>
    - <workhorse-model-2>
  # Architecture review seats and skeptics.
  arch:
    - <arch-model-1>
    - <arch-model-2>
  # Adversarial review seats and the test-sufficiency gate.
  review:
    - <review-model-1>
    - <review-model-2>
mcp_servers:
  playright:
    transport: stdio
    command: npx
    args:
    - '--yes'
    - '@playwright/mcp@latest'
    - '--browser'
    - chromium
    - '--executable-path'
    - /usr/bin/chromium
    - '--headless'
    env:
      PLAYWRIGHT_BROWSERS_PATH: ''
    log_stderr: true
    log_stdout: false
    block_list: []
